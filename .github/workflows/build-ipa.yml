name: Build sideload IPA
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: ['OnCare/**', 'OnCareLive/**', 'Shared/**', 'OnCareTests/**', 'OnCareUITests/**', 'project.yml', '.github/workflows/build-ipa.yml']
  push:
    branches: [main]
    paths: ['OnCare/**', 'OnCareLive/**', 'Shared/**', 'OnCareTests/**', 'OnCareUITests/**', 'project.yml', '.github/workflows/build-ipa.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Select iOS 26 SDK
        run: |
          XCODE=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort | tail -1)
          test -n "$XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml
      - name: Compile iPhone application
        run: >-
          xcodebuild -project OnCare.xcodeproj -scheme OnCare
          -configuration Release -sdk iphoneos
          -destination 'generic/platform=iOS' -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Choose and boot iPhone simulator
        run: |
          SIM_ID=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(v["udid"] for k in sorted(d,reverse=True) if "iOS" in k for v in d[k] if "iPhone" in v["name"]))')
          echo "SIM_ID=$SIM_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIM_ID" || true
          xcrun simctl bootstatus "$SIM_ID" -b
          xcrun simctl status_bar "$SIM_ID" override --time '9:41' --batteryState charged --batteryLevel 100
          xcrun simctl uninstall "$SIM_ID" app.oncare.personal || true
      - name: Verify storage, backups and user flows
        run: |
          set -o pipefail
          xcodebuild test -project OnCare.xcodeproj -scheme OnCare -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIM_ID" -derivedDataPath simulator-build \
            -resultBundlePath OnCare-tests.xcresult -parallel-testing-enabled NO \
            -skip-testing:OnCareUITests/WidgetGalleryTests \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO | tee ios-tests.log
      - name: Preserve app screens before restarting
        run: |
          mkdir -p ios-screenshots
          CONTAINER=$(xcrun simctl get_app_container "$SIM_ID" app.oncare.tests.ui.xctrunner data 2>/dev/null || true)
          if [ -n "$CONTAINER" ]; then
            find "$CONTAINER/Documents" -name '*.png' -exec cp {} ios-screenshots/ \;
          fi
      - name: Restart simulator for the system widget check
        run: |
          xcrun simctl shutdown "$SIM_ID"
          xcrun simctl boot "$SIM_ID"
          xcrun simctl bootstatus "$SIM_ID" -b
          xcrun simctl status_bar "$SIM_ID" override --time '9:41' --batteryState charged --batteryLevel 100
      - name: Verify the iOS system widget gallery
        run: |
          set -o pipefail
          xcodebuild test-without-building -project OnCare.xcodeproj -scheme OnCare -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIM_ID" -derivedDataPath simulator-build \
            -resultBundlePath OnCare-widget-tests.xcresult -parallel-testing-enabled NO \
            -only-testing:OnCareUITests/WidgetGalleryTests \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO | tee -a ios-tests.log
      - name: Collect actual iPhone screens
        if: always()
        run: |
          mkdir -p ios-screenshots
          CONTAINER=$(xcrun simctl get_app_container "$SIM_ID" app.oncare.tests.ui.xctrunner data 2>/dev/null || true)
          if [ -n "$CONTAINER" ]; then
            find "$CONTAINER/Documents" -name '*.png' -exec cp {} ios-screenshots/ \;
          fi
      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          test -d build/Build/Products/Release-iphoneos/OnCare.app
          mkdir -p package/Payload
          cp -R build/Build/Products/Release-iphoneos/OnCare.app package/Payload/
          cd package
          zip -qry ../OnCare-unsigned.ipa Payload
          python3 -c 'import zipfile,plistlib; z=zipfile.ZipFile("../OnCare-unsigned.ipa"); p=plistlib.loads(z.read("Payload/OnCare.app/Info.plist")); assert p["CFBundleIdentifier"]=="app.oncare.personal"; assert p["CFBundleShortVersionString"]=="3.15.0"; assert "Payload/OnCare.app/"+p["CFBundleExecutable"] in z.namelist(); print("PASS: real iPhone IPA structure and version")'
      - uses: actions/upload-artifact@v4
        with:
          name: OnCare-unsigned-ipa
          path: OnCare-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OnCare-iOS-v3-screens
          path: ios-screenshots/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OnCare-iOS-test-log
          path: ios-tests.log
          if-no-files-found: ignore
          retention-days: 7

